name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unresolved merge markers in tracked text
        run: |
          python3 -m unittest discover -s tools/validate -p test_conflicts.py
          python3 tools/validate/conflicts.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: bash
        run: |
          dotnet build src/LinesOfSupport.sln -c Release
          dotnet test src/LinesOfSupport.sln -c Release --no-build
          dotnet run --project src/LinesOfSupport.Harness -c Release --no-build -- validate scenarios/_stub

  scenarios:
    name: scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scenario and rules files against the schemas
        run: |
          pip install --quiet jsonschema
          python3 -m unittest discover -s tools/validate -p test_validate.py
          python3 -m unittest discover -s tools/validate -p test_people.py
          python3 -m unittest discover -s tools/validate -p test_support.py
          python3 tools/validate/validate.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check asset provenance
        run: |
          python3 -m unittest discover -s tools/validate -p test_provenance.py
          python3 tools/validate/provenance.py

  godot-shell:
    name: godot-shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot 4.6.1 .NET
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_mono_linux_x86_64.zip' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin=$(find "$RUNNER_TEMP/godot" -type f -name '*mono_linux.x86_64' -print -quit)
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
      - name: Build, import and smoke-test the shell
        shell: bash
        run: |
          dotnet build game/LinesOfSupport.Game.csproj -c Debug
          "$GODOT_BIN" --headless --path game --editor --import --quit
          timeout 60 "$GODOT_BIN" --headless --audio-driver Dummy --path game res://tests/MusicSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-music.log"
          grep -Fq 'MUSIC_SMOKE_PASS:' "$RUNNER_TEMP/godot-music.log"
          timeout 60 "$GODOT_BIN" --headless --audio-driver Dummy --path game res://tests/AudioSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-audio.log"
          grep -Fq 'AUDIO_SMOKE_PASS:' "$RUNNER_TEMP/godot-audio.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/ShellSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          grep -Fq 'SHELL_SMOKE_PASS:' "$RUNNER_TEMP/godot-smoke.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/FrontDoorSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-front.log"
          grep -Fq 'FRONT_DOOR_SMOKE_PASS:' "$RUNNER_TEMP/godot-front.log"
          timeout 60 "$GODOT_BIN" --headless --audio-driver Dummy --path game res://tests/LookSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-look.log"
          grep -Fq 'LOOK_SMOKE_PASS:' "$RUNNER_TEMP/godot-look.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/TabletopThemeSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-tabletop-theme.log"
          grep -Fq 'TABLETOP_THEME_SMOKE_PASS:' "$RUNNER_TEMP/godot-tabletop-theme.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/PortraitSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-portraits.log"
          grep -Fq 'PORTRAIT_SMOKE_PASS:' "$RUNNER_TEMP/godot-portraits.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/ArtStudySmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-art-study.log"
          grep -Fq 'ART_STUDY_SMOKE_PASS:' "$RUNNER_TEMP/godot-art-study.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/TeamSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-team.log"
