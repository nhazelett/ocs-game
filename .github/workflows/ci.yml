          grep -Fq 'KIT_SMOKE_PASS: 22 pieces, 22 glTF files loaded' "$RUNNER_TEMP/godot-extended-kit.log"

  export-windows:
    name: export-windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    needs: [test, scenarios, provenance, godot-shell]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot 4.6.1 .NET and matching export templates
        shell: pwsh
        run: |
          $release = 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable'
          curl.exe --fail --location --retry 3 "$release/Godot_v4.6.1-stable_mono_win64.zip" --output "$env:RUNNER_TEMP/godot.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed.' }
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          "GODOT_BIN=$($godot.FullName)" >> $env:GITHUB_ENV
          curl.exe --fail --location --retry 3 "$release/Godot_v4.6.1-stable_mono_export_templates.tpz" --output "$env:RUNNER_TEMP/templates.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Template download failed.' }
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $target = New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/4.6.1.stable.mono"
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $target.FullName -Recurse
      - name: Export, verify packaged scenarios and zip
        shell: pwsh
        run: ./tools/export/windows.ps1 -Godot $env:GODOT_BIN -OutputDirectory "$env:RUNNER_TEMP/windows-package"
      - name: Name the verified package
        id: package
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $label = if ($env:BUILD_REF.StartsWith('refs/tags/v')) { $env:BUILD_REF_NAME } else { $env:BUILD_SHA.Substring(0, 7) }
          $name = "LinesOfSupport-$label-windows-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Move-Item -LiteralPath "$env:RUNNER_TEMP/windows-package.zip" -Destination $archive
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
      - name: Attach the verified zip to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ARCHIVE_PATH --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:ARCHIVE_PATH --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release zip upload failed.' }
