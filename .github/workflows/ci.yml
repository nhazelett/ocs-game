name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: bash
        run: |
          dotnet build src/LinesOfSupport.sln -c Release
          dotnet test src/LinesOfSupport.sln -c Release --no-build
          dotnet run --project src/LinesOfSupport.Harness -c Release --no-build -- validate scenarios/_stub

  scenarios:
    name: scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scenario and rules files against the schemas
        run: |
          pip install --quiet jsonschema
          python3 tools/validate/validate.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check asset provenance
        run: |
          python3 -m unittest discover -s tools/validate -p test_provenance.py
          python3 tools/validate/provenance.py

  godot-shell:
    name: godot-shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot 4.6.1 .NET
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_mono_linux_x86_64.zip' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin=$(find "$RUNNER_TEMP/godot" -type f -name '*mono_linux.x86_64' -print -quit)
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
      - name: Build, import and smoke-test the shell
        shell: bash
        run: |
          dotnet build game/LinesOfSupport.Game.csproj -c Debug
          "$GODOT_BIN" --headless --path game --editor --import --quit
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/ShellSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          grep -Fq 'SHELL_SMOKE_PASS:' "$RUNNER_TEMP/godot-smoke.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/BoardSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-board.log"
          grep -Fq 'BOARD_SMOKE_PASS:' "$RUNNER_TEMP/godot-board.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/SessionSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-session.log"
          grep -Fq 'SESSION_SMOKE_PASS:' "$RUNNER_TEMP/godot-session.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/MorningSmokeTest.tscn 2>&1 | tee "$RUNNER_TEMP/godot-morning.log"
          grep -Fq 'MORNING_SMOKE_PASS:' "$RUNNER_TEMP/godot-morning.log"
          python3 -m py_compile tools/bpy/generate_kit.py
          python3 tools/validate/validate_kit.py
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/KitExperiment.tscn -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/godot-kit.log"
          grep -Fq 'KIT_SMOKE_PASS: five pieces, 5 glTF files loaded' "$RUNNER_TEMP/godot-kit.log"
          timeout 60 "$GODOT_BIN" --headless --path game res://tests/KitExperiment.tscn -- --extended-kit --smoke-test 2>&1 | tee "$RUNNER_TEMP/godot-extended-kit.log"
          grep -Fq 'KIT_SMOKE_PASS: 22 pieces, 22 glTF files loaded' "$RUNNER_TEMP/godot-extended-kit.log"

  export-windows:
    name: export-windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, scenarios, provenance, godot-shell]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot 4.6.1 .NET and matching export templates
        shell: pwsh
        run: |
          $release = 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable'
          curl.exe --fail --location --retry 3 "$release/Godot_v4.6.1-stable_mono_win64.zip" --output "$env:RUNNER_TEMP/godot.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed.' }
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          "GODOT_BIN=$($godot.FullName)" >> $env:GITHUB_ENV
          curl.exe --fail --location --retry 3 "$release/Godot_v4.6.1-stable_mono_export_templates.tpz" --output "$env:RUNNER_TEMP/templates.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Template download failed.' }
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $target = New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/4.6.1.stable.mono"
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $target.FullName -Recurse
      - name: Export, verify packaged scenarios and zip
        shell: pwsh
        run: ./tools/export/windows.ps1 -Godot $env:GODOT_BIN -OutputDirectory "$env:RUNNER_TEMP/windows-package"
      - uses: actions/upload-artifact@v4
        with:
          name: LinesOfSupport-${{ github.ref_name }}-windows-x86_64
          path: ${{ runner.temp }}/windows-package.zip
          if-no-files-found: error
